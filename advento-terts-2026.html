<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendário do Advento</title>
<!--
  CALENDÁRIO DO ADVENTO
  Para mudar o título, os desafios e as surpresas, procura «CONFIGURAÇÃO»
  mais abaixo, no início do <script>. Não é preciso mexer em mais nada.

  Para testar outro dia, acrescenta ?data=AAAA-MM-DD ao endereço.
  Exemplo: index.html?data=2026-12-07
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,800;1,500&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%84%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --pagina: #F1F4EE;
    --tinta: #1D351D;
    --tinta-suave: #4D5F4B;
    --moldura: #1D351D;
    --pinho: #325632;
    --floresta: #1D351D;
    --numero-claro: #FBFCF8;
    --fechado-fundo: #FBFCF8;
    --fechado-padrao: #CAD6C6;
    --num-fechado: #7C907A;
    --argamassa: #D3DCD0;
    --vermelho: #8B181D;
    --bordeaux: #6F0F11;
    --vermelho-texto: #8B181D;
    --pinho-texto: #325632;
    --vela: #8B181D;
    --ouro: #C8922A;
    --rama: #325632;
    --cartao: #FFFFFF;
    --sombra: rgba(29, 53, 29, 0.25);
    --letra-titulo: "Alegreya", Georgia, "Times New Roman", serif;
    --letra-texto: "Alegreya Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --pagina: #1D351D;
      --tinta: #EEF2EA;
      --tinta-suave: #A9BBA6;
      --moldura: #0F1F10;
      --pinho: #325632;
      --floresta: #1D351D;
      --numero-claro: #FBFCF8;
      --fechado-fundo: #E8EDE4;
      --fechado-padrao: #B9C8B5;
      --num-fechado: #6C826A;
      --argamassa: #A3B39F;
      --vermelho: #8B181D;
      --bordeaux: #6F0F11;
      --vermelho-texto: #EE8287;
      --pinho-texto: #A3CFA0;
      --vela: #B0262C;
      --ouro: #E0AC45;
      --rama: #4A7A4A;
      --cartao: #24432A;
      --sombra: rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --pagina: #1D351D;
    --tinta: #EEF2EA;
    --tinta-suave: #A9BBA6;
    --moldura: #0F1F10;
    --pinho: #325632;
    --floresta: #1D351D;
    --numero-claro: #FBFCF8;
    --fechado-fundo: #E8EDE4;
    --fechado-padrao: #B9C8B5;
    --num-fechado: #6C826A;
    --argamassa: #A3B39F;
    --vermelho: #8B181D;
    --bordeaux: #6F0F11;
    --vermelho-texto: #EE8287;
    --pinho-texto: #A3CFA0;
    --vela: #B0262C;
    --ouro: #E0AC45;
    --rama: #4A7A4A;
    --cartao: #24432A;
    --sombra: rgba(0, 0, 0, 0.5);
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: var(--pagina);
    color: var(--tinta);
    font-family: var(--letra-texto);
    font-size: 1.0625rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* Aviso do modo de teste */
  .aviso-teste {
    display: flex; flex-wrap: wrap; gap: .5rem 1rem;
    justify-content: center; align-items: center;
    padding: .6rem 1rem;
    background: color-mix(in srgb, var(--vermelho) 13%, var(--pagina));
    color: var(--tinta);
    font-size: .95rem;
    text-align: center;
  }
  .aviso-teste button {
    font: inherit; font-weight: 700;
    background: none; border: 0; padding: .2rem;
    color: var(--tinta); text-decoration: underline; cursor: pointer;
  }

  main {
    max-width: 61rem;
    margin: 0 auto;
    padding: clamp(1.5rem, 5vw, 3.25rem) clamp(.75rem, 4vw, 2rem) 3rem;
  }

  /* Topo */
  .topo { text-align: center; }
  .velas { width: 9.5rem; margin: 0 auto; }
  .velas svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chama { transform-box: fill-box; transform-origin: 50% 100%; animation: tremer 2.6s ease-in-out infinite; }
  .chama:nth-of-type(2n) { animation-duration: 3.1s; }
  @keyframes tremer {
    0%, 100% { transform: scale(1, 1); }
    50% { transform: scale(.93, 1.06); }
  }
  h1 {
    font-family: var(--letra-titulo);
    font-weight: 800;
    font-size: clamp(2.3rem, 7vw, 3.75rem);
    line-height: 1.02;
    letter-spacing: -0.015em;
    margin: .35rem 0 .3rem;
    text-wrap: balance;
  }
  .subtitulo {
    margin: 0;
    font-family: var(--letra-titulo);
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.15rem, 2.6vw, 1.35rem);
    color: var(--tinta-suave);
  }
  .estado {
    margin: 1.25rem auto 0;
    max-width: 34em;
    font-size: 1.125rem;
    text-wrap: pretty;
  }

  /* Árvore de azulejos */
  .arvore-moldura {
    --cols: 7;
    --contorno: 5px;
    width: min(100%, calc(var(--cols) * 6.5rem));
    margin: clamp(1.25rem, 3vw, 2rem) auto 0;
  }
  @media (max-width: 480px) { .arvore-moldura { --contorno: 4px; } }
  .estrela-linha, .arvore {
    display: grid;
    grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    gap: 2px;
  }
  .estrela {
    position: relative;
    z-index: 3;
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    margin-bottom: -22%;
    overflow: visible;
    transform: scale(1.2);
    transform-origin: 50% 100%;
    pointer-events: none;
  }
  .estrela path { fill: var(--pagina); stroke: var(--ouro); stroke-width: 4; stroke-linejoin: round; transition: fill .6s ease; }
  .estrela.acesa path { fill: var(--ouro); }
  .estrela.acesa { filter: drop-shadow(0 0 10px color-mix(in srgb, var(--ouro) 70%, transparent)); }
  .arvore {
    filter:
      drop-shadow(var(--contorno) 0 0 var(--moldura))
      drop-shadow(calc(var(--contorno) * -1) 0 0 var(--moldura))
      drop-shadow(0 var(--contorno) 0 var(--moldura))
      drop-shadow(0 calc(var(--contorno) * -1) 0 var(--moldura))
      drop-shadow(0 18px 22px var(--sombra));
  }
  .arvore .azulejo { box-shadow: 0 0 0 1px var(--argamassa); }

  .azulejo {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    margin: 0; padding: 0; border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
    perspective: 800px;
    container-type: inline-size;
    -webkit-tap-highlight-color: transparent;
  }
  .azulejo.bloqueada, .azulejo.decorativo { cursor: default; }
  .azulejo:focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; z-index: 2; }

  .porta {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.3, .75, .25, 1);
  }
  .azulejo.aberta .porta { transform: rotateY(180deg); }
  @media (hover: hover) {
    .azulejo.disponivel:not(.aberta):hover .porta { transform: rotateY(-14deg); }
  }

  .face {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    overflow: hidden;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    background: var(--pinho);
    color: var(--floresta);
  }
  .face svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .frente { transition: color .6s ease, background-color .6s ease; }
  .verso { transform: rotateY(180deg); background: var(--vermelho); color: var(--bordeaux); }

  .rotulo {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    line-height: 1;
    transition: color .6s ease;
    transition-delay: inherit;
  }
  .frente .rotulo, .verso .rotulo { color: var(--numero-claro); }
  .num {
    font-family: var(--letra-titulo);
    font-weight: 800;
    font-variant-numeric: lining-nums;
    font-size: 1.6rem;
    font-size: 29cqi;
  }
  .mes {
    font-weight: 700;
    font-size: .7rem;
    font-size: 10cqi;
    margin-top: .2em;
  }
  .marca { display: none; font-weight: 700; font-size: .8rem; font-size: 12cqi; margin-top: .15em; }
  .feito .marca { display: block; }
  @container (max-width: 64px) {
    .num { font-size: 34cqi; }
    .mes { display: none; }
  }

  /* Portas fechadas e pintura inicial */
  .bloqueada .frente,
  .parede:not(.pintada) .disponivel .frente { background: var(--fechado-fundo); color: var(--fechado-padrao); }
  .bloqueada .frente .rotulo,
  .parede:not(.pintada) .disponivel .frente .rotulo { color: var(--num-fechado); }

  /* Porta de hoje */
  .hoje .face::after {
    content: "";
    position: absolute;
    inset: 19.5%;
    border-radius: 50%;
    border: max(2px, 3.2cqi) solid var(--ouro);
    box-shadow: 0 0 4cqi color-mix(in srgb, var(--ouro) 55%, transparent);
  }

  /* Rodapé */
  .resumo { margin-top: 1.5rem; text-align: center; color: var(--tinta-suave); }
  .resumo p { margin: .2rem 0; text-wrap: balance; }

  /* Aviso curto */
  .aviso {
    position: fixed;
    left: 50%;
    bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    width: max-content;
    max-width: calc(100vw - 2rem);
    padding: .7rem 1.1rem;
    border-radius: 6px;
    background: var(--tinta);
    color: var(--pagina);
    font-weight: 500;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 1rem);
    transition: opacity .2s ease, transform .2s ease;
  }
  .aviso.visivel { opacity: 1; transform: translate(-50%, 0); }

  /* Janela da porta aberta */
  .janela {
    width: min(34rem, calc(100vw - 1.5rem));
    max-height: calc(100dvh - 2rem);
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: var(--cartao);
    color: var(--tinta);
    box-shadow: 0 30px 70px -20px rgba(0, 0, 0, .55);
    overflow: auto;
  }
  .janela::backdrop { background: rgba(14, 28, 15, .62); }
  .faixa {
    display: flex;
    gap: 1px;
    height: 3.25rem;
    overflow: hidden;
    background: var(--bordeaux);
    color: var(--bordeaux);
  }
  .faixa svg { flex: none; width: 3.25rem; height: 3.25rem; background: var(--vermelho); }
  .janela-corpo { padding: 1.4rem clamp(1.1rem, 4vw, 1.9rem) 1.6rem; }
  .janela-data { margin: 0; font-size: .98rem; color: var(--tinta-suave); }
  .etiqueta {
    display: inline-block;
    margin-top: .7rem;
    padding: .18em .7em;
    border-radius: 999px;
    font-size: .88rem;
    font-weight: 700;
  }
  .etiqueta.desafio { color: var(--vermelho-texto); background: color-mix(in srgb, var(--vermelho) 13%, transparent); }
  .etiqueta.surpresa { color: var(--pinho-texto); background: color-mix(in srgb, var(--pinho) 16%, transparent); }
  .janela h2 {
    margin: .55rem 0 .7rem;
    font-family: var(--letra-titulo);
    font-weight: 800;
    font-size: clamp(1.6rem, 5vw, 2.05rem);
    line-height: 1.12;
    text-wrap: balance;
  }
  .janela-texto p { margin: 0 0 .75em; max-width: 60ch; }
  .janela-imagem { display: block; max-width: 100%; height: auto; margin: .25rem 0 .5rem; border-radius: 4px; }
  .acoes { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .6rem; margin-top: 1.25rem; }
  .botao {
    display: inline-flex; align-items: center; gap: .4em;
    padding: .7em 1.15em;
    border: 2px solid var(--tinta-suave);
    border-radius: 6px;
    background: transparent;
    color: var(--tinta);
    font: inherit;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.2;
    text-decoration: none;
    cursor: pointer;
  }
  .botao.principal { background: var(--vermelho); border-color: var(--vermelho); color: #fff; }
  .botao.principal:hover { background: var(--bordeaux); border-color: var(--bordeaux); }
  .botao[aria-pressed="true"] { background: var(--pinho); border-color: var(--pinho); color: #fff; }
  .botao:focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .porta, .frente, .rotulo, .aviso { transition: none !important; }
    .chama { animation: none; }
  }
</style>
</head>
<body>

<!-- Desenho dos azulejos -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="padrao" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="6">
      <circle cx="0" cy="0" r="22"/><circle cx="100" cy="0" r="22"/>
      <circle cx="0" cy="100" r="22"/><circle cx="100" cy="100" r="22"/>
    </g>
    <g fill="currentColor">
      <circle cx="0" cy="0" r="9"/><circle cx="100" cy="0" r="9"/>
      <circle cx="0" cy="100" r="9"/><circle cx="100" cy="100" r="9"/>
      <path d="M50 -12 L59 0 L50 12 L41 0Z"/>
      <path d="M50 88 L59 100 L50 112 L41 100Z"/>
      <path d="M-12 50 L0 41 L12 50 L0 59Z"/>
      <path d="M88 50 L100 41 L112 50 L100 59Z"/>
      <circle cx="22" cy="22" r="3.2"/><circle cx="78" cy="22" r="3.2"/>
      <circle cx="22" cy="78" r="3.2"/><circle cx="78" cy="78" r="3.2"/>
    </g>
    <circle cx="50" cy="50" r="27" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <circle cx="50" cy="50" r="31" fill="none" stroke="currentColor" stroke-width=".9"/>
  </symbol>
  <symbol id="rosacea" viewBox="0 0 100 100">
    <use href="#padrao"/>
    <g fill="currentColor">
      <ellipse cx="50" cy="38" rx="6" ry="11"/><ellipse cx="50" cy="62" rx="6" ry="11"/>
      <ellipse cx="38" cy="50" rx="11" ry="6"/><ellipse cx="62" cy="50" rx="11" ry="6"/>
    </g>
  </symbol>
</svg>

<div class="aviso-teste" id="aviso-teste" hidden>
  <span id="aviso-teste-texto"></span>
  <button type="button" id="limpar">Fechar todas as portas</button>
</div>

<main>
  <header class="topo">
    <div class="velas" id="velas"></div>
    <h1 id="titulo">Calendário do Advento</h1>
    <p class="subtitulo" id="subtitulo"></p>
    <p class="estado" id="estado" aria-live="polite"></p>
  </header>

  <div class="arvore-moldura" id="arvore-moldura">
    <div class="estrela-linha" aria-hidden="true">
      <svg class="estrela" id="estrela" viewBox="0 0 100 100" focusable="false">
        <path d="M50 10 L60.58 39.44 L91.85 40.4 L67.12 59.56 L75.86 89.6 L50 72 L24.14 89.6 L32.88 59.56 L8.15 40.4 L39.42 39.44 Z"/>
      </svg>
    </div>
    <div class="arvore parede" id="parede"></div>
  </div>

  <footer class="resumo" id="resumo"></footer>
</main>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<dialog class="janela" id="janela" aria-labelledby="janela-titulo">
  <div class="faixa" id="faixa" aria-hidden="true"></div>
  <div class="janela-corpo">
    <p class="janela-data" id="janela-data"></p>
    <span class="etiqueta" id="janela-etiqueta"></span>
    <h2 id="janela-titulo"></h2>
    <div class="janela-texto" id="janela-texto"></div>
    <img class="janela-imagem" id="janela-imagem" alt="" hidden>
    <div class="acoes">
      <a class="botao" id="janela-link" target="_blank" rel="noopener" hidden></a>
      <button type="button" class="botao" id="botao-feito" aria-pressed="false" hidden>Marcar como feito</button>
      <button type="button" class="botao principal" id="botao-fechar">Fechar</button>
    </div>
  </div>
</dialog>

<script>
/* =====================================================================
   CONFIGURAÇÃO
   ===================================================================== */

const CONFIG = {
  titulo: "Calendário do Advento",
  subtitulo: "Uma porta por dia, até à véspera de Natal",
  baralharPortas: true   // true = números fora de ordem; false = a árvore enche-se de baixo para cima.
                         // Em ambos os casos, o primeiro dia fica no tronco e o último no topo.
};

/*
  Uma entrada por dia. Campos:
    data      "AAAA-MM-DD" (obrigatório)
    tipo      "desafio" ou "surpresa"
    titulo    texto curto
    texto     texto principal; uma linha em branco (\n) cria um novo parágrafo
  Campos opcionais:
    imagem           caminho ou endereço de uma imagem, ex.: "imagens/dia-10.jpg"
    descricaoImagem  o que a imagem mostra, para leitores de ecrã
    link             endereço a abrir num botão, ex.: a playlist da equipa
    textoLink        texto desse botão, ex.: "Abrir a playlist"

  O Advento de 2026 vai de 29 de novembro (1.º Domingo) a 24 de dezembro.
*/
const PORTAS = [
  { data: "2026-11-29", tipo: "surpresa", titulo: "Começa o Advento",
    texto: "Hoje é o primeiro Domingo do Advento e acende-se a primeira vela da coroa.\nAté 24 de dezembro há uma porta nova por dia: umas trazem surpresas, outras desafios. Boa contagem decrescente!" },
  { data: "2026-11-30", tipo: "desafio", titulo: "Bom dia a sério",
    texto: "Antes do almoço, deseja bom dia a três colegas com quem raramente falas. Pessoalmente vale a dobrar." },
  { data: "2026-12-01", tipo: "surpresa", titulo: "Dia de feriado",
    texto: "Hoje é feriado da Restauração da Independência. Descansa, que a porta de amanhã traz trabalho." },
  { data: "2026-12-02", tipo: "desafio", titulo: "A caneca da equipa",
    texto: "Tira uma fotografia à caneca ou garrafa que usas todos os dias e partilha-a no canal da equipa. Vamos ver quem tem a mais original." },
  { data: "2026-12-03", tipo: "surpresa", titulo: "Pequeno-almoço na copa",
    texto: "Às 10h há café e bolo-rei na copa para toda a gente. Aparece!" },
  { data: "2026-12-04", tipo: "desafio", titulo: "Sexta-feira natalícia",
    texto: "Hoje é dia de vestir algo natalício: uma camisola, um gorro, umas meias. Vale tudo, desde que se note." },
  { data: "2026-12-05", tipo: "surpresa", titulo: "Sugestão para o fim de semana",
    texto: "Que tal visitar um presépio perto de casa? Muitas igrejas e juntas de freguesia montam presépios nesta altura." },
  { data: "2026-12-06", tipo: "surpresa", titulo: "A segunda vela",
    texto: "Segundo Domingo do Advento: já há duas velas acesas na coroa. Faltam 19 dias para o Natal." },
  { data: "2026-12-07", tipo: "desafio", titulo: "Obrigado em atraso",
    texto: "Envia uma mensagem a um colega a agradecer algo que ele fez este ano e que ficou por agradecer." },
  { data: "2026-12-08", tipo: "surpresa", titulo: "Feriado da Imaculada Conceição",
    texto: "Hoje é feriado. Para muitas famílias, é o dia de montar a árvore de Natal e o presépio. Já tens a tua?" },
  { data: "2026-12-09", tipo: "desafio", titulo: "Playlist de Natal",
    texto: "Acrescenta uma música à playlist de Natal da equipa. Regra única: não pode ser uma que já lá esteja." },
  { data: "2026-12-10", tipo: "surpresa", titulo: "Curiosidade do dia",
    texto: "O bolo-rei terá chegado a Portugal no século XIX pela Confeitaria Nacional, em Lisboa, a partir de uma receita francesa." },
  { data: "2026-12-11", tipo: "desafio", titulo: "Secretária festiva",
    texto: "Decora a tua secretária, ou o fundo das tuas videochamadas, com um toque natalício. Partilha uma fotografia até ao fim do dia." },
  { data: "2026-12-12", tipo: "surpresa", titulo: "Receita de fim de semana",
    texto: "Fica a sugestão: rabanadas feitas em casa. Pão da véspera, leite, ovos, açúcar e canela. Quem fizer, mostra uma fotografia na segunda-feira." },
  { data: "2026-12-13", tipo: "surpresa", titulo: "A vela cor-de-rosa",

    texto: "Envia à organização uma fotografia tua em criança até quarta-feira. Na sexta há jogo de adivinhas com todas." },
  { data: "2026-12-15", tipo: "surpresa", titulo: "Chocolate quente",
    texto: "A meio da tarde há chocolate quente na copa. Leva a tua caneca." },
  { data: "2026-12-16", tipo: "desafio", titulo: "Um elogio para começar",

    texto: "Escreve um postal de Natal à mão para um colega e deixa-o na secretária dele. Assinado ou anónimo, tu escolhes." },

    texto: "Hoje revelamos as fotografias de infância. Às 16h, na sala grande ou online: consegues adivinhar quem é quem?" },
  { data: "2026-12-19", tipo: "surpresa", titulo: "Sessão de cinema",

  { data: "2026-12-20", tipo: "surpresa", titulo: "A coroa completa",
    texto: "Quarto Domingo do Advento: as quatro velas estão acesas. Faltam 5 dias para o Natal." },
  { data: "2026-12-21", tipo: "desafio", titulo: "Caixa solidária",
    texto: "Traz um bem alimentar ou um brinquedo em bom estado para a caixa solidária na receção. Entregamos tudo antes do Natal." },
  { data: "2026-12-22", tipo: "desafio", titulo: "Um desejo para 2027",
    texto: "Escreve num papel um desejo para a equipa em 2027 e põe-no no frasco da copa. Lemos todos em janeiro." },
  { data: "2026-12-23", tipo: "surpresa", titulo: "Lanche de Natal",
    texto: "Às 16h30 há lanche de Natal para toda a equipa. Obrigado por este ano!" },
  { data: "2026-12-24", tipo: "surpresa", titulo: "Feliz Natal",

];

/* =====================================================================
   Daqui para baixo não é preciso mexer.
   ===================================================================== */
(function () {
  "use strict";

  const MESES_CURTOS = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const fmtDiaMes = new Intl.DateTimeFormat("pt-PT", { day: "numeric", month: "long" });
  const fmtCompleto = new Intl.DateTimeFormat("pt-PT", { weekday: "long", day: "numeric", month: "long" });
  const reduzirMovimento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ISO = /^\d{4}-\d{2}-\d{2}$/;
  const SVGNS = "http://www.w3.org/2000/svg";

  const pad = n => String(n).padStart(2, "0");
  const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const paraData = iso => { const [a, m, d] = iso.split("-").map(Number); return new Date(a, m - 1, d); };
  const diaMes = iso => fmtDiaMes.format(paraData(iso));
  const completo = iso => { const t = fmtCompleto.format(paraData(iso)); return t.charAt(0).toUpperCase() + t.slice(1); };
  const diasEntre = (a, b) => Math.round((paraData(b) - paraData(a)) / 86400000);

  function el(tag, classe, texto) {
    const e = document.createElement(tag);
    if (classe) e.className = classe;
    if (texto != null) e.textContent = texto;
    return e;
  }
  function svgUse(id) {
    const s = document.createElementNS(SVGNS, "svg");
    s.setAttribute("viewBox", "0 0 100 100");
    s.setAttribute("aria-hidden", "true");
    s.setAttribute("focusable", "false");
    const u = document.createElementNS(SVGNS, "use");
    u.setAttribute("href", "#" + id);
    s.appendChild(u);
    return s;
  }

  /* ---------- Dados ---------- */
  const vistas = new Set();
  const portas = PORTAS
    .filter(p => p && ISO.test(p.data) && !vistas.has(p.data) && vistas.add(p.data))
    .map(p => Object.assign({}, p, { tipo: p.tipo === "desafio" ? "desafio" : "surpresa" }))
    .sort((a, b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : 0));

  const pedido = new URLSearchParams(location.search).get("data");
  const modoTeste = !!pedido && ISO.test(pedido);
  const hoje = modoTeste ? pedido : isoLocal(new Date());

  document.title = CONFIG.titulo || "Calendário do Advento";
  document.getElementById("titulo").textContent = document.title;
  const sub = document.getElementById("subtitulo");
  if (CONFIG.subtitulo) sub.textContent = CONFIG.subtitulo; else sub.hidden = true;

  if (!portas.length) {
    document.getElementById("estado").textContent = "Ainda não há portas. Acrescenta-as na lista PORTAS deste ficheiro.";
    return;
  }

  const primeira = portas[0].data;
  const ultima = portas[portas.length - 1].data;
  const anoNatal = Number(ultima.slice(0, 4));
  const mesPrincipal = ultima.slice(5, 7);

  /* ---------- Memória do navegador ---------- */
  const CHAVE = "calendario-advento-" + anoNatal;
  let estado = { abertas: [], feitos: [] };
  try {
    const guardado = JSON.parse(localStorage.getItem(CHAVE));
    if (guardado && Array.isArray(guardado.abertas)) {
      estado = { abertas: guardado.abertas, feitos: Array.isArray(guardado.feitos) ? guardado.feitos : [] };
    }
  } catch (e) { /* sem memória disponível: funciona na mesma durante a visita */ }
  function guardar() {
    try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) { /* ignorar */ }
  }

  /* ---------- Coroa do Advento ---------- */
  function domingosAdvento(ano) {
    const natal = new Date(ano, 11, 25);
    const recuo = natal.getDay() === 0 ? 7 : natal.getDay();
    const quarto = new Date(ano, 11, 25 - recuo);
    return [21, 14, 7, 0].map(k => isoLocal(new Date(ano, 11, quarto.getDate() - k)));
  }
  function desenharVelas(acesas) {
        const xs = [38, 68, 98, 128];
    const yRama = x => { const t = (x - 12) / 142; return 80 + 40 * t * (1 - t); };
    let s = `<svg viewBox="0 0 166 100" role="img" aria-label="${acesas} de 4 velas da coroa do Advento acesas">`;
    xs.forEach((x, i) => {
      const topo = yRama(x) - 46;
      s += `<rect x="${x - 8}" y="${topo}" width="16" height="48" rx="2.5" style="fill:var(--vela)"/>`;
      s += `<line x1="${x}" y1="${topo}" x2="${x}" y2="${topo - 6}" style="stroke:var(--tinta-suave)" stroke-width="1.6" stroke-linecap="round"/>`;
      if (i < acesas) {
        s += `<g class="chama"><circle cx="${x}" cy="${topo - 14}" r="11" style="fill:var(--ouro)" opacity=".2"/>` +
             `<path d="M${x} ${topo - 26} C${x + 6.5} ${topo - 17} ${x + 5} ${topo - 8} ${x} ${topo - 6} C${x - 5} ${topo - 8} ${x - 6.5} ${topo - 17} ${x} ${topo - 26}Z" style="fill:var(--ouro)"/></g>`;
      }
    });
    s += `<path d="M12 80 Q83 100 154 80" fill="none" style="stroke:var(--rama)" stroke-width="7" stroke-linecap="round"/>`;
    for (let i = 0; i <= 12; i++) {
      const t = i / 12, x = 12 + 142 * t, y = 80 + 40 * t * (1 - t);
      const ang = Math.atan2(40 * (1 - 2 * t), 142) * 180 / Math.PI + (i % 2 ? 32 : -32);
      s += `<ellipse cx="${x.toFixed(1)}" cy="${(y + (i % 2 ? -3 : 3)).toFixed(1)}" rx="7.5" ry="3.4" transform="rotate(${ang.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})" style="fill:var(--rama)"/>`;
    }
    return s + "</svg>";
  }
  const velasAcesas = domingosAdvento(anoNatal).filter(d => d <= hoje).length;
  document.getElementById("velas").innerHTML = desenharVelas(velasAcesas);

  /* ---------- Parede de azulejos ---------- */
  const parede = document.getElementById("parede");
  let primeiraVez = true;

  function gerador(semente) {
    let a = semente >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function baralhar(lista, rnd) {
    for (let i = lista.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [lista[i], lista[j]] = [lista[j], lista[i]];
    }
  }
  // Copa em andares (1-3-5, 3-5-7, ...) e tronco com 1 a 4 azulejos, conforme o número de portas
  function formaArvore(n) {
    for (let t = 1; ; t++) {
      const linhas = [];
      for (let i = 0; i < t; i++) linhas.push(1 + 2 * i, 3 + 2 * i, 5 + 2 * i);
      const copa = linhas.reduce((a, b) => a + b, 0);
      if (n <= copa + 4 || t >= 6) return { linhas, tronco: Math.max(1, Math.min(4, n - copa)) };
    }
  }
  function criarRotulo(p, comMarca) {
    const r = el("span", "rotulo");
    r.appendChild(el("span", "num", String(Number(p.data.slice(8, 10)))));
    if (p.data.slice(5, 7) !== mesPrincipal) r.appendChild(el("span", "mes", MESES_CURTOS[Number(p.data.slice(5, 7)) - 1]));
    if (comMarca) r.appendChild(el("span", "marca", "✓"));
    return r;
  }
  function criarAzulejo(p) {
    const b = el("button", "azulejo");
    b.type = "button";
    b.dataset.data = p.data;
    const porta = el("span", "porta");
    const frente = el("span", "face frente");
    frente.append(svgUse("padrao"), criarRotulo(p, false));
    const verso = el("span", "face verso");
    verso.append(svgUse("padrao"), criarRotulo(p, true));
    porta.append(frente, verso);
    b.appendChild(porta);
    b.addEventListener("click", () => aoClicar(p, b));
    atualizarAzulejo(b, p);
    return b;
  }
  function criarDecorativo() {
    const d = el("div", "azulejo decorativo");
    d.setAttribute("aria-hidden", "true");
    const f = el("span", "face");
    f.appendChild(svgUse("rosacea"));
    d.appendChild(f);
    return d;
  }
  function atualizarAzulejo(b, p) {
    const fechada = p.data > hoje;
    const aberta = !fechada && estado.abertas.includes(p.data);
    b.classList.toggle("bloqueada", fechada);
    b.classList.toggle("disponivel", !fechada);
    b.classList.toggle("hoje", p.data === hoje);
    b.classList.toggle("aberta", aberta);
    b.classList.toggle("feito", estado.feitos.includes(p.data));
    let desc = diaMes(p.data) + (p.data === hoje ? ", hoje" : "");
    desc += fechada ? ". Ainda fechada." : aberta ? ". Já aberta." : ". Pronta a abrir.";
    b.setAttribute("aria-label", desc);
    if (fechada) b.setAttribute("aria-disabled", "true"); else b.removeAttribute("aria-disabled");
  }
  function azulejoDe(p) {
    return parede.querySelector(`[data-data="${p.data}"]`);
  }
  function construir() {
    const forma = formaArvore(portas.length);
    const cols = Math.max(...forma.linhas);
    const meio = (cols + 1) / 2;
    document.getElementById("arvore-moldura").style.setProperty("--cols", cols);
    document.getElementById("estrela").style.gridColumn = String(meio);

    // Casas da árvore, de cima para baixo
    const copa = [], tronco = [];
    forma.linhas.forEach((largura, r) => {
      const inicio = (cols - largura) / 2 + 1;
      for (let c = 0; c < largura; c++) copa.push({ linha: r + 1, coluna: inicio + c });
    });
    for (let h = 0; h < forma.tronco; h++) tronco.push({ linha: forma.linhas.length + h + 1, coluna: meio });
    const totalLinhas = forma.linhas.length + forma.tronco;

    // O último dia fica no topo e o primeiro na base do tronco
    const conteudo = new Map();
    conteudo.set(copa[0], portas[portas.length - 1]);
    if (portas.length > 1) conteudo.set(tronco[tronco.length - 1], portas[0]);
    const meioPortas = portas.slice(1, -1);
    const restoTronco = tronco.slice(0, -1);
    const restoCopa = copa.slice(1);
    if (CONFIG.baralharPortas) {
      baralhar(meioPortas, gerador(anoNatal));
      restoTronco.forEach(c => { if (meioPortas.length) conteudo.set(c, meioPortas.shift()); });
      const lista = meioPortas.concat(Array(Math.max(0, restoCopa.length - meioPortas.length)).fill(null));
      baralhar(lista, gerador(anoNatal + 1));
      restoCopa.forEach((c, i) => conteudo.set(c, lista[i] || null));
    } else {
      const ordem = restoTronco.slice().reverse()
        .concat(restoCopa.slice().sort((a, b) => b.linha - a.linha || a.coluna - b.coluna));
      ordem.forEach((c, i) => conteudo.set(c, meioPortas[i] || null));
    }

    const pintar = primeiraVez && !reduzirMovimento;
    parede.classList.toggle("pintada", !pintar);
    parede.textContent = "";
    copa.concat(tronco).forEach(c => {
      const p = conteudo.get(c);
      const azulejo = p ? criarAzulejo(p) : criarDecorativo();
      azulejo.style.gridRow = String(c.linha);
      azulejo.style.gridColumn = String(c.coluna);
      if (p && pintar && p.data <= hoje) {
        azulejo.querySelector(".frente").style.transitionDelay = ((totalLinhas - c.linha) * 90) + "ms";
      }
      parede.appendChild(azulejo);
    });
    if (pintar) requestAnimationFrame(() => requestAnimationFrame(() => parede.classList.add("pintada")));
    primeiraVez = false;
  }

  /* ---------- Abrir portas ---------- */
  const janela = document.getElementById("janela");
  const botaoFeito = document.getElementById("botao-feito");
  let portaAtual = null;
  let temporizador;

  function aoClicar(p, b) {
    if (p.data > hoje) {
      mostrarAviso(`Ainda não. Esta porta só abre a ${diaMes(p.data)}.`);
      return;
    }
    if (estado.abertas.includes(p.data)) { abrirJanela(p); return; }
    estado.abertas.push(p.data);
    guardar();
    atualizarAzulejo(b, p);
    atualizarTextos();
    clearTimeout(temporizador);
    temporizador = setTimeout(() => abrirJanela(p), reduzirMovimento ? 0 : 650);
  }
  function abrirJanela(p) {
    clearTimeout(temporizador);
    portaAtual = p;
    document.getElementById("janela-data").textContent = completo(p.data);
    const etiqueta = document.getElementById("janela-etiqueta");
    etiqueta.textContent = p.tipo === "desafio" ? "Desafio" : "Surpresa";
    etiqueta.className = "etiqueta " + p.tipo;
    document.getElementById("janela-titulo").textContent = p.titulo || diaMes(p.data);

    const texto = document.getElementById("janela-texto");
    texto.textContent = "";
    String(p.texto || "").split(/\n+/).map(s => s.trim()).filter(Boolean)
      .forEach(par => texto.appendChild(el("p", null, par)));

    const img = document.getElementById("janela-imagem");
    if (p.imagem) { img.src = p.imagem; img.alt = p.descricaoImagem || ""; img.hidden = false; }
    else { img.hidden = true; img.removeAttribute("src"); }

    const link = document.getElementById("janela-link");
    if (p.link) { link.href = p.link; link.textContent = p.textoLink || "Abrir ligação"; link.hidden = false; }
    else link.hidden = true;

    botaoFeito.hidden = p.tipo !== "desafio";
    atualizarBotaoFeito();
    if (!janela.open) janela.showModal();
    document.getElementById("botao-fechar").focus();
  }
  function atualizarBotaoFeito() {
    const feito = !!portaAtual && estado.feitos.includes(portaAtual.data);
    botaoFeito.setAttribute("aria-pressed", feito ? "true" : "false");
    botaoFeito.textContent = feito ? "Feito ✓" : "Marcar como feito";
  }
  botaoFeito.addEventListener("click", () => {
    if (!portaAtual) return;
    const i = estado.feitos.indexOf(portaAtual.data);
    if (i >= 0) estado.feitos.splice(i, 1); else estado.feitos.push(portaAtual.data);
    guardar();
    atualizarBotaoFeito();
    const b = azulejoDe(portaAtual);
    if (b) atualizarAzulejo(b, portaAtual);
    atualizarTextos();
  });
  document.getElementById("botao-fechar").addEventListener("click", () => janela.close());
  janela.addEventListener("click", e => { if (e.target === janela) janela.close(); });
  janela.addEventListener("close", () => {
    const b = portaAtual && azulejoDe(portaAtual);
    if (b) b.focus({ preventScroll: true });
  });

  const faixa = document.getElementById("faixa");
  for (let i = 0; i < 12; i++) faixa.appendChild(svgUse("padrao"));

  /* ---------- Textos ---------- */
  function atualizarTextos() {
    let frase;
    if (hoje < primeira) {
      const n = diasEntre(hoje, primeira);
      frase = `O calendário começa a ${diaMes(primeira)}. ${n === 1 ? "Falta 1 dia." : `Faltam ${n} dias.`}`;
    } else if (hoje > ultima) {
      frase = "O Advento terminou, mas todas as portas continuam abertas para espreitar. Feliz Natal!";
    } else if (!portas.some(p => p.data === hoje)) {
      frase = "Hoje não há porta nova. As dos dias anteriores continuam à tua espera.";
    } else if (estado.abertas.includes(hoje)) {
      frase = hoje === ultima ? "Já abriste a última porta. Feliz Natal!" : "Já abriste a porta de hoje. Amanhã há outra.";
    } else {
      frase = `${completo(hoje)}. A porta de hoje é a do círculo dourado.`;
    }
    document.getElementById("estado").textContent = frase;

    const resumo = document.getElementById("resumo");
    resumo.textContent = "";
    const disponiveis = portas.filter(p => p.data <= hoje);
    if (!disponiveis.length) return;
    const abertas = disponiveis.filter(p => estado.abertas.includes(p.data)).length;
    const desafios = disponiveis.filter(p => p.tipo === "desafio");
    const feitos = desafios.filter(p => estado.feitos.includes(p.data)).length;
    let linha = `Abriste ${abertas} de ${disponiveis.length} ${disponiveis.length === 1 ? "porta" : "portas"}.`;
    if (desafios.length) linha += ` Desafios feitos: ${feitos} de ${desafios.length}.`;
    resumo.appendChild(el("p", null, linha));
    if (hoje <= ultima) resumo.appendChild(el("p", null, "Se faltares a um dia, a porta fica à tua espera."));
  }

  const aviso = document.getElementById("aviso");
  let tAviso;
  function mostrarAviso(t) {
    aviso.textContent = t;
    aviso.classList.add("visivel");
    clearTimeout(tAviso);
    tAviso = setTimeout(() => aviso.classList.remove("visivel"), 2600);
  }

  /* ---------- Modo de teste ---------- */
  if (modoTeste) {
    const ano = hoje.slice(0, 4);
    document.getElementById("aviso-teste-texto").textContent =
      `Modo de teste: a simular ${fmtCompleto.format(paraData(hoje))} de ${ano}. Para voltar à data real, retira ?data= do endereço.`;
    document.getElementById("aviso-teste").hidden = false;
    document.getElementById("limpar").addEventListener("click", () => {
      estado = { abertas: [], feitos: [] };
      guardar();
      construir();
      atualizarTextos();
      mostrarAviso("Todas as portas voltaram a fechar.");
    });
  }

  /* ---------- Arranque ---------- */
  document.getElementById("estrela").classList.toggle("acesa", hoje >= ultima);
  construir();
  atualizarTextos();
})();
</script>
